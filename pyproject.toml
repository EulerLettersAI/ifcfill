[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ifcfill"
version = "0.2.0"
description = "Transformer of tabular data into Integer, Float and Categorical (IFC) variables with missing data imputation."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Samer Elkababji", email = "skababji@gmail.com" },
]
keywords = ["tabular", "imputation", "missing data", "categorical", "preprocessing", "machine learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
]

[project.optional-dependencies]
examples = [
    "notebook>=7.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "build>=1.0",
    "twine>=4.0",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.25",
    "mkdocs-autorefs>=0.5",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/EulerLettersAI/ifcfill"
Documentation = "https://eulerlettersai.github.io/ifcfill"
Repository = "https://github.com/EulerLettersAI/ifcfill"
Issues = "https://github.com/EulerLettersAI/ifcfill/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

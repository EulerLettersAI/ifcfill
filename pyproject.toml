[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ifcfill"
version = "0.1.0"
description = "Transformer of tabular data into Integer, Float and Categorical (IFC) variables with missing data imputation."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "EulerLettersAI", email = "your-email@example.com" },
]
keywords = ["tabular", "imputation", "missing data", "categorical", "preprocessing", "machine learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
]

[project.optional-dependencies]
polars = ["polars>=1.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "build>=1.0",
    "twine>=4.0",
]

[project.urls]
Homepage = "https://github.com/EulerLettersAI/ifcfill"
Repository = "https://github.com/EulerLettersAI/ifcfill"
Issues = "https://github.com/EulerLettersAI/ifcfill/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

site_name: ifcfill
site_description: >-
  Transform tabular data into Integer, Float and Categorical (IFC) variables
  with fast NumPy-powered missing data imputation and full transformation tracking.
site_url: https://eulerlettersai.github.io/ifcfill
repo_url: https://github.com/EulerLettersAI/ifcfill
repo_name: EulerLettersAI/ifcfill
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Examples: examples.md
  - User Guide: user-guide.md
  - API Reference: api.md
  - Changelog: changelog.md
